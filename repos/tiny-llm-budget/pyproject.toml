[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-llm-budget"
version = "0.1.0"
description = "LLM context-window budget calculator. Zero dependencies."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com" },
]
keywords = ["llm", "tokens", "context-window", "budget", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
openai = ["tiktoken>=0.5"]
dev = ["pytest>=7.0", "tiktoken>=0.5"]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-llm-budget"

[tool.setuptools]
py-modules = ["tiny_llm_budget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
