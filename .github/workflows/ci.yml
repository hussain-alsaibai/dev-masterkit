name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Validates that every skill declares valid AgentSkills frontmatter,
      # that no build artefact is tracked, and reports how many skills are
      # still pending conversion (skills/AGENTSKILLS_PENDING.md).
      - name: Check repository structure
        run: python3 scripts/check_structure.py

  skill-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Scans the skills with NVIDIA SkillSpector against the committed
      # suppression baseline. Fails if the scanner version drifts from the
      # baseline (a stale baseline suppresses nothing, so every reviewed
      # finding looks new) or if any finding is not covered by a reviewed
      # baseline entry.
      - name: Install SkillSpector
        run: pip install 'git+https://github.com/NVIDIA/SkillSpector@v2.13.4'

      - name: Scan skills
        run: python3 scripts/scan_skills.py

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The scripts/ directory holds executable checks that were never
      # covered by a test, so a bug in one of them could ship silently.
      # This job runs the tests that exist for those scripts.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run script tests
        run: python -m pytest tests/ -q

  # The tiny-* ecosystem list appears on every package README and claims a
  # coherent toolkit. On 2026-11-09 that list was checked by installing each
  # entry: 13 of 25 shipped no packaging metadata, and 3 told the reader to
  # pip-install a name owned by another maintainer. No single package's CI
  # can see that; only a job that takes the user's position can.
  #
  # This job does NOT run the live sweep. The runner has no checkouts of the
  # sibling repos, so a live run would report every entry as NO-CLONE and a
  # green badge would mean nothing. Instead it proves the detector is
  # working, against wheels and READMEs it builds itself. The live sweep is
  # run deliberately, from a host that has the clones, with:
  #     python3 scripts/ecosystem_smoke.py
  ecosystem-detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      # These tests fail if the empty-wheel detector is weakened, if the
      # README squat check stops firing on an unwarned collision, or if it
      # starts firing on the three READMEs that warn correctly.
      - name: Run ecosystem detector tests
        run: python -m pytest tests/test_ecosystem_smoke.py -q
