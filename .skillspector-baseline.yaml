# 2026-11-24: regenerated at 2.13.1 after CI (skill-security) started failing.
# Why it failed: the 2026-11-23 commit extended skills/bounty-scanner/SKILL.md,
# which re-issues the PE3 fingerprints for that file (v2 fingerprints bind to
# the whole component sha256), so 4 reviewed PE3 findings on prose about
# credential paths (`~/.git-credentials`, `access token`) looked new. The CI
# job installed the newest skillspector (2.13.4) while the previous baseline
# named 2.13.4 -- so this was NOT a version bump. The change was the skill.
# Regenerated with the pinned 2.13.1 install; rule+file set is unchanged
# (125 -> 127 entries: TM1 and YR1 now report as exact fingerprints, and their
# glob rules are kept below as the stable fallback).
# SkillSpector baseline — findings listed here are suppressed on future scans.
# Edit 'reason' fields and add glob 'rules' as needed. See docs/SUPPRESSION.md.
version: 2
scanner_version: 2.13.1
rules:
  # 2026-11-20: hash-bound fingerprints for these two prose findings did not
  # suppress under a full ./skills scan of 55 components, even though the
  # scanner re-emitted the identical fingerprint (verified by loading the
  # baseline and checking membership, and by recomputing the digest). Path +
  # message globs are the documented stable alternative and bind to the
  # reviewed text rather than to file bytes.
  - id: TM1
    path: "disk-prune-that-actually-frees/SKILL.md"
    message: "*remove */home/node/go-mod/*"
    reason: >-
      Reviewed 2026-11-20. Quoted `rm: cannot remove ... Permission denied`
      error transcript showing why rm fails on a read-only Go module cache.
      No removal command is executed; the skill prescribes `go clean -modcache`.
  - id: YR1
    path: "verification-sweep/SKILL.md"
    message: "*pip install git+https://*"
    reason: >-
      Reviewed 2026-11-20. YARA agent_skill_remote_bootstrap_execution matched
      this literal inside a prose table row recording an anti-pattern (README
      claiming one install line while llms.txt was wrong). Nothing is run.

